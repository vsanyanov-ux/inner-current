<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=JetBrains+Mono:wght@700;800&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: #06070a;
    color: #f1f5f9;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    position: relative;
    padding: 45px 45px 45px 45px;
  }

  .glow-top {
    position: absolute;
    top: -100px;
    left: 20%;
    width: 600px;
    height: 350px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, transparent 70%);
    pointer-events: none;
  }
  .glow-bottom {
    position: absolute;
    bottom: -100px;
    right: 10%;
    width: 600px;
    height: 350px;
    background: radial-gradient(circle, rgba(239, 68, 68, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .badge {
    background: rgba(168, 85, 247, 0.22);
    border: 2px solid rgba(168, 85, 247, 0.8);
    color: #c084fc;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: #94a3b8;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
  }
  .brand-tag span {
    color: #38bdf8;
  }

  .headline {
    font-size: 38px;
    font-weight: 900;
    line-height: 1.15;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    z-index: 10;
  }
  .headline .highlight-purple {
    color: #c084fc;
    text-shadow: 0 0 30px rgba(192, 132, 252, 0.45);
  }
  .headline .highlight-red {
    color: #f87171;
    text-shadow: 0 0 30px rgba(248, 113, 113, 0.45);
  }

  .visual-container {
    position: relative;
    z-index: 10;
    width: 990px;
    height: 870px;
    margin: 0 auto;
  }

  .image-wrapper {
    width: 100%;
    height: 100%;
    border-radius: 26px;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
    background: #000;
  }

  .main-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .punchline-strip {
    z-index: 10;
    background: rgba(15, 23, 42, 0.9);
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    border-radius: 18px;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
  }

  .punchline-quote {
    font-size: 19px;
    font-weight: 900;
    color: #f8fafc;
  }
  .punchline-quote span {
    color: #f87171;
  }

  .cta-pill {
    background: #0284c7;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 16px;
    padding: 10px 22px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <!-- ВЕРХНЯЯ ПЛАШКА -->
  <div class="top-meta">
    <div class="badge">Взлом догмы #06</div>
    <div class="brand-tag">⚡ <span>ВНУТРЕННИЙ ТОК</span> // АНАТОМИЯ</div>
  </div>

  <!-- БОЛЬШОЙ КРУПНЫЙ ЗАГОЛОВОК -->
  <div class="headline">
    Алкоголь <span class="highlight-purple">не создает радость</span>.<br>
    Он просто <span class="highlight-red">ворует её у завтра.</span>
  </div>

  <!-- ГИГАНТСКАЯ КАРТИНКА БЕЗ ОБРЕЗКИ -->
  <div class="visual-container">
    <div class="image-wrapper">
      <img src="meme_alcohol_raw.jpg" class="main-image" alt="Пятница vs Суббота">
    </div>
  </div>

  <!-- ТОЛЬКО ОДНА КРУПНАЯ ЧИСТАЯ СТРОКА СНИЗУ -->
  <div class="punchline-strip">
    <div class="punchline-quote">
      Химический разряд <span>не заменит чистый контур.</span>
    </div>
    <div class="cta-pill">@inner_current ➔</div>
  </div>

</body>
</html>
