<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=JetBrains+Mono:wght@700;800&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1080px;
    height: 1920px;
    background: #06070a;
    color: #f1f5f9;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    position: relative;
    /* Учет безопасных зон Shorts */
    padding: 110px 48px 240px 48px;
  }

  /* Фоновые вспышки */
  .glow-top {
    position: absolute;
    top: -100px;
    left: 20%;
    width: 700px;
    height: 400px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, transparent 70%);
    pointer-events: none;
  }
  .glow-bottom {
    position: absolute;
    bottom: -100px;
    right: 10%;
    width: 700px;
    height: 500px;
    background: radial-gradient(circle, rgba(244, 63, 94, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Верхняя метка */
  .top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .badge {
    background: rgba(56, 189, 248, 0.22);
    border: 2px solid rgba(56, 189, 248, 0.8);
    color: #38bdf8;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
  }

  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    color: #94a3b8;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
  }
  .brand-tag span {
    color: #38bdf8;
  }

  /* ОГРОМНЫЙ КРУПНЫЙ ЗАГОЛОВОК */
  .headline {
    font-size: 48px;
    font-weight: 900;
    line-height: 1.15;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    z-index: 10;
    margin: 10px 0 15px 0;
  }
  .headline .highlight-blue {
    color: #38bdf8;
    text-shadow: 0 0 35px rgba(56, 189, 248, 0.5);
  }
  .headline .highlight-red {
    color: #f43f5e;
    text-shadow: 0 0 35px rgba(244, 63, 94, 0.5);
  }

  /* ГИГАНТСКАЯ КАРТИНКА БЕЗ ОБРЕЗКИ (1376:768 -> 984:549) */
  .visual-container {
    position: relative;
    z-index: 10;
    width: 984px;
    height: 550px;
    margin: 0 auto;
    flex-shrink: 0;
  }

  .image-wrapper {
    width: 100%;
    height: 100%;
    border-radius: 28px;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
    background: #000;
  }

  .main-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ЧИСТЫЙ МИНИМАЛИСТИЧНЫЙ НИЗ: 2 КРУПНЫХ БЛОКА */
  .bottom-bar {
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 15px;
  }

  .comment-hook-card {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(244, 63, 94, 0.12));
    border: 1.5px solid rgba(56, 189, 248, 0.4);
    border-radius: 20px;
    padding: 20px 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .comment-hook-text {
    font-size: 18px;
    font-weight: 800;
    color: #bae6fd;
    line-height: 1.3;
  }

  .comment-hook-badge {
    background: #38bdf8;
    color: #000;
    font-weight: 900;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
  }

  .punchline-strip {
    background: rgba(15, 23, 42, 0.9);
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
  }

  .punchline-quote {
    font-size: 20px;
    font-weight: 900;
    color: #f8fafc;
    letter-spacing: -0.3px;
  }
  .punchline-quote span {
    color: #38bdf8;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
  }

  .cta-pill {
    background: #0284c7;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 18px;
    padding: 12px 26px;
    border-radius: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 0 25px rgba(2, 132, 199, 0.5);
    white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <!-- ВЕРХНЯЯ ПЛАШКА -->
  <div class="top-meta">
    <div class="badge">Взлом догмы #04</div>
    <div class="brand-tag">⚡ <span>INNER CURRENT</span> // SHORTS</div>
  </div>

  <!-- БОЛЬШОЙ КРУПНЫЙ ЗАГОЛОВОК -->
  <div class="headline">
    Процессор <span class="highlight-blue">мощнее NASA</span>.<br>
    А ты скроллишь рилсы <span class="highlight-red">в 2 часа ночи.</span>
  </div>

  <!-- ГИГАНТСКАЯ КАРТИНКА БЕЗ ОБРЕЗКИ -->
  <div class="visual-container">
    <div class="image-wrapper">
      <img src="meme_gadget_raw.jpg" class="main-image" alt="День 1 vs День 21">
    </div>
  </div>

  <!-- ЧИСТЫЙ МИНИМАЛИСТИЧНЫЙ НИЗ -->
  <div class="bottom-bar">
    <div class="comment-hook-card">
      <div class="comment-hook-text">
        💬 Сколько часов экранного времени в день на твоем смартфоне?
      </div>
      <div class="comment-hook-badge">Пиши честно ➔</div>
    </div>

    <div class="punchline-strip">
      <div class="punchline-quote">
        Титановый корпус не лечит пустоту. <span>Где твой ток?</span>
      </div>
      <div class="cta-pill">@inner_current ➔</div>
    </div>
  </div>

</body>
</html>
