# Nginx virtual host for Standalone Site: Однодневный тур по Цимле
server {
    listen 80;
    listen [::]:80;

    server_name tsimla.156-67-63-13.nip.io tour.156-67-63-13.nip.io www.tsimla.156-67-63-13.nip.io;

    root /var/www/tsimla;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml font/woff2 font/woff;

    location ~* \.(jpg|jpeg|png|svg|ico|webp|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
