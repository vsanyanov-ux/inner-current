server {
    server_name innercurrent.ru www.innercurrent.ru innercurrent.156-67-63-13.nip.io books.156-67-63-13.nip.io innercurrent.org www.innercurrent.org;

    root /var/www/innercurrent;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2 font/woff application/pdf;

    # Защита директории с базой данных SQLite
    location ^~ /data/ {
        deny all;
        return 404;
    }

    # API телеметрии и статистики Inner Current
    location /api/stats/ {
        proxy_pass http://127.0.0.1:8033/api/stats/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прямой трекинг скачиваний PDF
    location /dl/ {
        proxy_pass http://127.0.0.1:8033/dl/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Закрытая панель админки
    location = /admin {
        try_files /admin.html =404;
    }
    location = /admin/ {
        try_files /admin.html =404;
    }

    location ~* \.(mp3|m4a|m4b|pdf|jpg|jpeg|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/innercurrent.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/innercurrent.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.innercurrent.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = innercurrent.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name innercurrent.ru www.innercurrent.ru innercurrent.156-67-63-13.nip.io books.156-67-63-13.nip.io innercurrent.org www.innercurrent.org;
    return 301 https://$host$request_uri;
}
